<div class="col scroll-reveal">
  <div class="card h-100 border-0 product-card">
    <a href="{% url 'store:product_detail' product.slug %}" class="card-img-wrap d-block">
      {% if product.image %}
        <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
      {% else %}
        <div class="img-placeholder"><i class="bi bi-cpu"></i></div>
      {% endif %}
    </a>
    <div class="card-body d-flex flex-column p-3">
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="badge bg-secondary">{{ product.category.name }}</span>
        {% if product.brand %}<span style="font-size:0.75rem;color:var(--text-3);font-family:var(--font-mono)">{{ product.brand }}</span>{% endif %}
      </div>
      <h6 class="card-title mb-0" style="font-size:0.9rem;line-height:1.4">
        <a href="{% url 'store:product_detail' product.slug %}" class="text-dark text-decoration-none">
          {{ product.name }}
        </a>
      </h6>
      <div class="mt-auto pt-3 d-flex justify-content-between align-items-center">
        <span class="card-price"><span class="sym">$</span>{{ product.price }}</span>
        {% if product.in_stock %}
          <form method="post" action="{% url 'store:cart_add' product.id %}">
            {% csrf_token %}
            <input type="hidden" name="quantity" value="1">
            <button class="btn btn-warning btn-sm px-3" title="Add to cart">
              <i class="bi bi-cart-plus"></i>
            </button>
          </form>
        {% else %}
          <span class="badge bg-secondary">Out of Stock</span>
        {% endif %}
      </div>
    </div>
  </div>
</div>
