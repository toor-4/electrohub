<div class="col scroll-reveal">
  <div class="card h-100 shadow-sm border-0 product-card">
    <a href="{% url 'store:product_detail' product.slug %}">
      {% if product.image %}
        <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
      {% else %}
        <div class="img-placeholder"><i class="bi bi-cpu"></i></div>
      {% endif %}
    </a>
    <div class="card-body d-flex flex-column">
      <small class="text-muted mb-1">
        <span class="badge bg-secondary">{{ product.category.name }}</span>
        {% if product.brand %}<span class="ms-1">{{ product.brand }}</span>{% endif %}
      </small>
      <h6 class="card-title">
        <a href="{% url 'store:product_detail' product.slug %}" class="text-dark text-decoration-none">
          {{ product.name }}
        </a>
      </h6>
      <div class="mt-auto">
        <div class="d-flex justify-content-between align-items-center mt-2">
          <span class="fw-bold text-primary fs-5">${{ product.price }}</span>
          {% if product.in_stock %}
            <form method="post" action="{% url 'store:cart_add' product.id %}">
              {% csrf_token %}
              <input type="hidden" name="quantity" value="1">
              <button class="btn btn-warning btn-sm">
                <i class="bi bi-cart-plus"></i> Add
              </button>
            </form>
          {% else %}
            <span class="badge bg-secondary">Out of Stock</span>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
