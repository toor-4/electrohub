{% extends 'base.html' %}
{% block title %}Sign In — ElectroHub{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-1">Sign In</h3>
          <p class="text-muted text-center mb-4">Welcome back to ElectroHub</p>

          <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger small">
              Invalid username or password. Please try again.
            </div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label fw-semibold" for="id_username">Username</label>
              <input type="text" name="username" id="id_username" class="form-control"
                     autofocus autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="id_password">Password</label>
              <input type="password" name="password" id="id_password" class="form-control"
                     autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-warning w-100 fw-bold btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <p class="text-center mt-4 mb-0 text-muted">
            Don't have an account? <a href="{% url 'store:register' %}" class="text-decoration-none">Create one</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
